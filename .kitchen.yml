---
driver:
  name: vagrant

provisioner:
  name: chef_zero
  product_name: chef
  product_version: latest

verifier:
  name: inspec

platforms:
  # macOS platforms for Mac development machine cookbook
  - name: macos-14
    driver:
      box: bento/macos-14

  # Ubuntu for cross-platform testing
  - name: ubuntu-24.04
    driver:
      box: bento/ubuntu-24.04

suites:
  - name: default
    run_list:
      - recipe[brew-mac::default]
    attributes:
